name: Push DevStar Image to DockerHub

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      IMAGE_NAME:
        description: 'Docker image name'
        required: false
        type: string
        default: 'devstar-studio:latest'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps: 
      - name: Log in to DevStar.cn Registry  
        uses: docker/login-action@v2  
        with:  
          registry: devstar.cn  # 替换为目标镜像仓库  
          username: ${{ secrets.DEVSTAR_USERNAME }}  # 目标仓库用户名  
          password: ${{ secrets.DEVSTAR_PASSWORD }}  # 目标仓库密码  
          
      - name: Log in to Target Docker Registry  
        uses: docker/login-action@v2  
        with:  
          registry: docker.io  # 替换为目标镜像仓库  
          username: ${{ secrets.DOCKER_USERNAME }}  # 目标仓库用户名  
          password: ${{ secrets.DOCKER_PASSWORD }}  # 目标仓库密码  

      # Copy registry to registry so every platform (linux/amd64, linux/arm64)
      # reaches Docker Hub. docker pull/tag/push keeps only the runner's platform.
      - name: Copy Image to Target Registry
        run: |
          # stop here, before -prev is touched, if the source image is missing
          docker buildx imagetools inspect devstar.cn/devstar/${{ github.event.inputs.IMAGE_NAME }} > /dev/null
          docker buildx imagetools create --prefer-index=false -t devstarcn/${{ github.event.inputs.IMAGE_NAME }}-prev devstarcn/${{ github.event.inputs.IMAGE_NAME }}
          docker buildx imagetools create --prefer-index=false -t devstarcn/${{ github.event.inputs.IMAGE_NAME }} devstar.cn/devstar/${{ github.event.inputs.IMAGE_NAME }}
